<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Thanh tìm kiếm -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/students}" method="get" class="row gx-2 gy-2 align-items-center">
                <div class="col-md-8">
                    <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên hoặc email..." th:value="${keyword}">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-secondary w-100"><i class="bi bi-search me-1"></i> Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp rỗng -->
            <div th:if="${page.empty}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Chưa có sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${page.empty}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>
                        <a th:href="@{/students(page=${page.number}, size=${page.size}, keyword=${keyword}, sort='id,' + (${currentSort} == 'id' ? ${reverseDir} : 'asc'))}" class="text-white text-decoration-none">
                            ID <i class="bi" th:classappend="${currentSort == 'id' ? (currentDir == 'asc' ? 'bi-caret-up-fill' : 'bi-caret-down-fill') : ''}"></i>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/students(page=${page.number}, size=${page.size}, keyword=${keyword}, sort='name,' + (${currentSort} == 'name' ? ${reverseDir} : 'asc'))}" class="text-white text-decoration-none">
                            Họ tên <i class="bi" th:classappend="${currentSort == 'name' ? (currentDir == 'asc' ? 'bi-caret-up-fill' : 'bi-caret-down-fill') : ''}"></i>
                        </a>
                    </th>
                    <th>Email</th>
                    <th>Tuổi</th>
                    <th>Chuyên ngành</th>
                    <th>
                        <a th:href="@{/students(page=${page.number}, size=${page.size}, keyword=${keyword}, sort='gpa,' + (${currentSort} == 'gpa' ? ${reverseDir} : 'asc'))}" class="text-white text-decoration-none">
                            GPA <i class="bi" th:classappend="${currentSort == 'gpa' ? (currentDir == 'asc' ? 'bi-caret-up-fill' : 'bi-caret-down-fill') : ''}"></i>
                        </a>
                    </th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${page.content}">
                    <td th:text="${stat.count + (page.number * page.size)}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major.name}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Phân trang -->
    <div th:unless="${page.empty}" class="mt-4 d-flex justify-content-between align-items-center">
        <div class="text-muted">
            <small>Hiển thị <strong th:text="${page.numberOfElements}"></strong> trên tổng số <strong th:text="${page.totalElements}"></strong> sinh viên</small>
        </div>
        <nav th:if="${page.totalPages > 1}">
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${page.number - 1}, size=${page.size}, keyword=${keyword}, sort=${currentSort}+','+${currentDir})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${page.number == i} ? 'active'">
                    <a class="page-link" th:href="@{/students(page=${i}, size=${page.size}, keyword=${keyword}, sort=${currentSort}+','+${currentDir})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${page.number + 1}, size=${page.size}, keyword=${keyword}, sort=${currentSort}+','+${currentDir})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

</section>
</body>
</html>
